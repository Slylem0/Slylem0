# Every night: read my public GitHub activity, draw two koi with git-koi (a
# white one and a black one), put them in a pond fed by my commits, redraw the
# Claude-style terminal with my latest commits, and commit what changed.
name: Profile

on:
  schedule:
    - cron: "20 5 * * *"   # 00:20 in Colombia
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/profile.yml]

permissions:
  contents: write

concurrency: profile

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install --quiet pillow numpy
      - name: Fetch activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch.py "${{ github.repository_owner }}" data.json
      - name: Koi (white)
        uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi-white
      - name: Clear git-koi's download so it can run again
        run: rm -rf "$RUNNER_TEMP/git-koi"
      - name: Koi (black)
        uses: yalongwastaken/git-koi@v1
        with:
          body: black
          output-dir: koi-black
      - name: Draw
        run: |
          python scripts/gen_pond.py data.json koi-white/koi.gif koi-black/koi.gif assets/pond.gif
          python scripts/gen_terminal.py data.json assets/terminal.svg
      - name: Commit if changed
        run: |
          git add assets/pond.gif assets/terminal.svg
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "profile: redraw the pond and the terminal"
          git push --quiet
